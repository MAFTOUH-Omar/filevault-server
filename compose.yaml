services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: filevault
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d filevault"]
      interval: 10s
      retries: 5

  # Rate limiting, abuse counters and the /auth/me cache live here. Not published on the host: only
  # the api container reaches it. The password is optional (empty REDIS_PASSWORD = no auth).
  redis:
    image: redis:7
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --save "" ${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    # Loopback only, never the public interface: lets you reach the protected /actuator endpoints from the
    # server itself (curl -u monitor:... http://127.0.0.1:3322/actuator/prometheus, or an SSH tunnel).
    ports:
      - "127.0.0.1:3322:3322"
    environment:
      # These override whatever .env says (it targets a local, non-Docker setup).
      DB_URL: jdbc:postgresql://db:5432/filevault
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Reverse proxy + automatic HTTPS for the domain written in ./Caddyfile. It is the only public entry
  # point; the Caddyfile also hides every /actuator endpoint except /actuator/health.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:

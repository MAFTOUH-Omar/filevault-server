spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: filevault

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/filevault}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cache:
    type: redis
    redis:
      time-to-live: 5m   # safety-net TTL; mutations also explicitly evict (see UserSummaryCacheEvictor)

  mvc:
    # Responses (including Bean Validation messages) are always in English, regardless of the
    # client's Accept-Language header.
    locale: en
    locale-resolver: fixed

  jpa:
    open-in-view: false        # évite les requêtes SQL cachées
    hibernate:
      ddl-auto: validate       # Hibernate vérifie le schéma mais ne le modifie JAMAIS
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:200MB}
      max-request-size: ${MAX_FILE_SIZE:200MB}
      file-size-threshold: 2MB

server:
  port: 8080
  # Behind a reverse proxy (nginx/Caddy/OCI load balancer) request.getRemoteAddr() would be the proxy
  # for everyone, collapsing the per-IP rate limits, blacklist and abuse counter into one bucket.
  # "native" makes Tomcat's RemoteIpValve resolve the real client IP from X-Forwarded-For, honoring
  # the header only when the direct peer is a trusted proxy (loopback / private ranges by default;
  # tune with server.tomcat.remoteip.internal-proxies). A direct public client cannot spoof it.
  forward-headers-strategy: native
  error:
    # Defense in depth: devtools flips include-stacktrace to "always", and the default error body
    # would then leak stack traces. Our own handlers never include these, but never rely on defaults.
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    max-swallow-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  enabled: true
  path: /scalar
  url: /v3/api-docs

app:
  jwt:
    issuer: filevault
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
  refresh-token:
    ttl: 30d
    cookie-name: refresh_token
    cookie-secure: ${COOKIE_SECURE:false}   # true en production (HTTPS)
    cookie-same-site: Lax
  links:
    secret: ${LINK_SECRET}
    ttl: 5m
  signup:
    default-role: member
  storage:
    root: ${STORAGE_ROOT:./storage}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  rate-limit:
    global:
      limit: 100
      window: 1m
    auth:
      limit: 10
      window: 1m
  abuse:
    # Denied requests (bad credentials, bad token, missing permission) per IP inside `window`:
    # from warn-after on every denial carries a warning, the blacklist-after-th blacklists the IP.
    warn-after: 3
    blacklist-after: 6
    window: 1h

logging:
  level:
    com.filevault: DEBUG
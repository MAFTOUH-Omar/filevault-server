spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: filevault

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/filevault}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mvc:
    # Responses (including Bean Validation messages) are always in English, regardless of the
    # client's Accept-Language header.
    locale: en
    locale-resolver: fixed

  jpa:
    open-in-view: false        # évite les requêtes SQL cachées
    hibernate:
      ddl-auto: validate       # Hibernate vérifie le schéma mais ne le modifie JAMAIS
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:200MB}
      max-request-size: ${MAX_FILE_SIZE:200MB}
      file-size-threshold: 2MB

server:
  port: 8080
  tomcat:
    max-swallow-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  enabled: true
  path: /scalar
  url: /v3/api-docs

app:
  jwt:
    issuer: filevault
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
  refresh-token:
    ttl: 30d
    cookie-name: refresh_token
    cookie-secure: ${COOKIE_SECURE:false}   # true en production (HTTPS)
    cookie-same-site: Lax
  links:
    secret: ${LINK_SECRET}
    ttl: 5m
  signup:
    default-role: member
  storage:
    root: ${STORAGE_ROOT:./storage}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  rate-limit:
    global:
      limit: 100
      window: 1m
    auth:
      limit: 10
      window: 1m

logging:
  level:
    com.filevault: DEBUG
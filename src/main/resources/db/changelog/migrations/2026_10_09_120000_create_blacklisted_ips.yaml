databaseChangeLog:
  - changeSet:
      id: 2026_10_09_120000_create_blacklisted_ips
      author: filevault
      changes:
        - createTable:
            tableName: sec_blacklisted_ips
            columns:
              - column:
                  name: sec_id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_sec_blacklisted_ips
              - column:
                  name: sec_ip_address
                  type: varchar(45)      # fits IPv4 and IPv6
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_sec_blacklisted_ips_ip_address
              - column:
                  name: sec_reason
                  type: varchar(255)
              - column:
                  name: sec_created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
